<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0 12px; font: 13px -apple-system; color: #fff; text-align: center; user-select: none; }
  #time { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
  button { background: #2a2a2c; color: #fff; border: 0; border-radius: 7px; padding: 6px 12px; margin: 0 2px; font: inherit; }
  button:active { background: #3a3a3c; }
</style>
<div id="time">05:00</div>
<div>
  <button onclick="set(5)">5m</button>
  <button onclick="set(25)">25m</button>
  <button onclick="set(50)">50m</button>
  <button id="go" onclick="toggle()">Start</button>
</div>
<script>
  let remaining = 300, ends = null, tick = null;
  const render = () => {
    const s = Math.max(0, Math.ceil(remaining));
    document.getElementById('time').textContent =
      String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    document.getElementById('go').textContent = ends ? 'Pause' : 'Start';
  };
  const stop = () => { clearInterval(tick); ends = null; };
  function set(minutes) { stop(); remaining = minutes * 60; render(); }
  function toggle() {
    if (ends) { stop(); return render(); }
    ends = Date.now() + remaining * 1000;
    tick = setInterval(() => {
      remaining = (ends - Date.now()) / 1000;
      if (remaining <= 0) {
        stop();
        remaining = 0;
        purrch.exec('afplay /System/Library/Sounds/Glass.aiff');
      }
      render();
    }, 250);
    render();
  }
</script>
