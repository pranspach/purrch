<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0 12px; font: 13px -apple-system; color: #fff; text-align: center; user-select: none; }
  #time { font-size: 38px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #detail { color: #98989d; margin-bottom: 8px; }
  button { background: #2a2a2c; color: #fff; border: 0; border-radius: 7px; padding: 6px 12px; margin: 0 2px; font: inherit; }
</style>
<div id="time">Ready</div>
<div id="detail">Start a session and see how many times you switch apps.</div>
<div id="start">
  <button onclick="begin(25)">25m</button>
  <button onclick="begin(50)">50m</button>
  <button onclick="begin(90)">90m</button>
</div>
<div id="stop" hidden><button onclick="finish()">End Session</button></div>
<script>
  let ends = null, startSwitches = 0, switches = 0, tick = null, poll = null;
  const set = (id, value) => { document.getElementById(id).textContent = value; };
  const noun = (n) => `${n} app switch${n === 1 ? '' : 'es'}`;
  function show(active) {
    document.getElementById('start').hidden = active;
    document.getElementById('stop').hidden = !active;
  }
  async function begin(minutes) {
    startSwitches = (await purrch.activity()).appSwitches;
    switches = 0;
    ends = Date.now() + minutes * 60000;
    show(true);
    set('detail', noun(0));
    tick = setInterval(render, 500);
    poll = setInterval(async () => {
      switches = (await purrch.activity()).appSwitches - startSwitches;
      set('detail', noun(Math.max(switches, 0)));
    }, 15000);
    render();
  }
  function render() {
    const left = Math.ceil((ends - Date.now()) / 1000);
    if (left <= 0) {
      purrch.exec('afplay /System/Library/Sounds/Glass.aiff');
      return finish();
    }
    set('time', String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'));
  }
  function finish() {
    clearInterval(tick);
    clearInterval(poll);
    show(false);
    set('time', 'Done');
    set('detail', noun(Math.max(switches, 0)) + ' this session.');
  }
</script>
