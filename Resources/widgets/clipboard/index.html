<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0 12px; font: 13px -apple-system; color: #fff; user-select: none; }
  .item { padding: 6px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #1c1c1e; }
  #empty { color: #98989d; padding-top: 8px; }
</style>
<div id="list"></div>
<script>
  async function refresh() {
    const items = await purrch.clipboard();
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">Copy some text and it will show up here.</div>';
      return;
    }
    list.replaceChildren(...items.map((text) => {
      const row = document.createElement('div');
      row.className = 'item';
      row.textContent = text;
      row.title = text;
      row.onclick = () => purrch.copy(text);
      return row;
    }));
  }
  refresh();
  setInterval(refresh, 1500);
</script>
